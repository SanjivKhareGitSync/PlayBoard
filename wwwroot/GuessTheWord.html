<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlayBoard — Guess the Word</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14181F;
    --panel: #1D2430;
    --panel-raised: #242C3A;
    --paper: #F1E9D8;
    --amber: #D9A441;
    --amber-dim: #B8863A;
    --moss: #4C7A57;
    --brick: #B25445;
    --slate: #3A3F47;
    --text-hi: #EDEAE3;
    --text-lo: #9AA3AF;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--text-hi);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 32px;
    animation: rise 0.5s ease both;
  }

  h1 {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 2.4rem;
    letter-spacing: 0.5px;
    color: var(--paper);
  }

  h1 span { color: var(--amber); }

  header p {
    color: var(--text-lo);
    font-size: 0.95rem;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    animation: rise 0.6s ease both;
  }

  .panel + .panel { margin-top: 20px; }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-lo);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 13px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    color: var(--text-hi);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .field input:focus-visible {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.2);
  }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }

  button:disabled { opacity: 0.45; cursor: not-allowed; }

  button:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--amber);
    color: #1A1300;
    flex: 1;
  }
  .btn-primary:hover:not(:disabled) { background: #E5B15A; transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    color: var(--text-hi);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .btn-secondary:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }

  .btn-block { width: 100%; }

  #gameSection { min-width: max-content; }

  .account-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .account-bar .signed-in-as {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-lo);
  }

  .account-bar .signed-in-as strong {
    color: var(--paper);
    font-weight: 600;
  }

  .logout-btn {
    background: transparent;
    color: var(--text-lo);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 7px 14px;
    font-size: 0.8rem;
  }
  .logout-btn:hover { border-color: var(--brick); color: var(--brick); }

  .word-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-raised);
    border-radius: 8px;
    padding: 14px 18px;
    margin: 18px 0 20px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .word-meta .label { color: var(--text-lo); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.6px; }
  .word-meta .value { color: var(--amber); font-weight: 600; font-size: 1.1rem; }

  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-lo);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .section-label.active { color: var(--amber); }

  /* Revealed-letters pattern — read-only, deliberately muted */
  .pattern-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }

  .pattern-tile {
    width: 38px;
    height: 44px;
    border-radius: 6px;
    background: transparent;
    border: 2px dashed rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--amber);
    cursor: default;
  }

  .pattern-tile.blank { color: var(--text-lo); }

  .pattern-block { margin-bottom: 20px; }

  .gray-letters {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-lo);
    text-align: center;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .gray-letters .letters { color: var(--text-hi); font-weight: 600; }

  /* Attempts board — 5 fixed rows, one per guess */
  #attemptsBoard {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
    justify-self: center;
  }

  .attempt-row { transition: opacity 0.2s ease; }

  .attempt-row.row-pending { opacity: 0.35; pointer-events: none; }

  .attempt-row-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-lo);
    margin-bottom: 6px;
  }

  .attempt-row.row-active .attempt-row-label { color: var(--amber); }

  .tile-input-wrap { position: relative; }

  .tile-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .row-active .tile-row { cursor: text; }

  .guess-tile {
    width: 46px;
    height: 52px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1.4rem;
    text-transform: uppercase;
    color: var(--text-hi);
    transition: border-color 0.1s ease, background 0.1s ease, box-shadow 0.1s ease;
  }

  .guess-tile.filled { border-color: var(--amber-dim); background: rgba(217,164,65,0.08); }

  .guess-tile.next {
    border-color: var(--amber);
    animation: caretPulse 1.2s ease-in-out infinite;
  }

  .row-active .tile-row:focus-within .guess-tile.next {
    animation: none;
    box-shadow: 0 0 0 3px rgba(217,164,65,0.35);
  }

  .guess-tile.result {
    color: var(--paper);
    animation: flip 0.35s ease both;
  }
  .guess-tile.status-GRAY  { background: var(--slate); border-color: var(--slate); }
  .guess-tile.status-YELLOW { background: var(--amber); border-color: var(--amber); color: #1A1300; }
  .guess-tile.status-GREEN { background: var(--moss); border-color: var(--moss); }

  .guess-tile:nth-child(1) { animation-delay: 0.02s; }
  .guess-tile:nth-child(2) { animation-delay: 0.07s; }
  .guess-tile:nth-child(3) { animation-delay: 0.12s; }
  .guess-tile:nth-child(4) { animation-delay: 0.17s; }
  .guess-tile:nth-child(5) { animation-delay: 0.22s; }
  .guess-tile:nth-child(6) { animation-delay: 0.27s; }
  .guess-tile:nth-child(7) { animation-delay: 0.32s; }

  #guessInput {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    font-size: 16px; /* prevents iOS zoom-on-focus */
    border: none;
    background: transparent;
    cursor: text;
  }

  #newWordBtn { width: 100%; margin-bottom: 4px; }

  #submitGuessBtn { margin-top: 4px; }

  .congrats-banner {
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    margin: 16px 0 0;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .congrats-banner.win {
    background: rgba(76,122,87,0.15);
    border-color: var(--moss);
    color: #8FC79D;
  }
  .congrats-banner.lose {
    background: rgba(178,84,69,0.15);
    border-color: var(--brick);
    color: #E39B90;
  }

  #result {
    width: 100%;
    max-width: 520px;
    margin-top: 22px;
    padding: 16px 18px;
    background: var(--panel);
    border-left: 3px solid var(--amber-dim);
    border-radius: 0 8px 8px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--text-lo);
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
  }

  .hidden { display: none !important; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes flip {
    from { opacity: 0; transform: rotateX(90deg); }
    to { opacity: 1; transform: rotateX(0); }
  }

  @keyframes caretPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(217,164,65,0.12); }
    50% { box-shadow: 0 0 0 3px rgba(217,164,65,0.4); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.9rem; }
    .panel { padding: 24px 20px; }
    .guess-tile { width: 38px; height: 44px; font-size: 1.1rem; }
    .pattern-tile { width: 32px; height: 38px; font-size: 1rem; }
  }
</style>
</head>
<body>

  <header>
    <h1>Play<span>Board</span></h1>
    <p>Guess the word, one tile at a time.</p>
  </header>

  <!-- Login / Sign up -->
  <div id="loginSection" class="panel">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>
    <div class="btn-row">
      <button id="loginBtn" class="btn-primary">Sign in</button>
      <button id="signupBtn" class="btn-secondary">Create account</button>
    </div>
  </div>

  <!-- Game (hidden until login) -->
  <div id="gameSection" class="panel hidden">
    <div class="account-bar">
      <span class="signed-in-as">Signed in as <strong id="signedInUser"></strong></span>
      <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>

    <button id="newWordBtn" class="btn-primary">Get new word</button>

    <div id="wordInfo" class="word-meta hidden">
      <span class="label">Word length</span>
      <span class="value"><span id="maxLen">0</span> letters</span>
    </div>

    <div class="pattern-block">
      <div class="section-label">Revealed letters</div>
      <div id="patternRow" class="pattern-row"></div>
    </div>

    <div id="grayLettersDisplay" class="gray-letters">Not in word: —</div>

    <div id="attemptsBoard"></div>

    <!-- Collapsed placeholder home for the shared input before any word is loaded.
         Must stay 0x0 and positioned, so #guessInput's absolute inset:0 never
         expands to cover the full viewport before JS moves it into a real row. -->
    <div class="tile-input-wrap" style="width:0; height:0; overflow:hidden;">
      <input id="guessInput" type="text" maxlength="0" autocomplete="off" />
    </div>

    <button id="submitGuessBtn" class="btn-primary btn-block">Submit guess</button>
    <div id="congratsBanner" class="congrats-banner hidden"></div>
  </div>

  <pre id="result"></pre>

<script>
  const API_BASE_URL = "https://playboard-gwdzehg5bee5fje4.indiasouthcentral-01.azurewebsites.net";
  const authUrl     = `${API_BASE_URL}/api/Auth/Login`;
  const registerUrl = `${API_BASE_URL}/api/Auth/Register`;
  const wordUrl     = `${API_BASE_URL}/api/GuessTheWord/GetNewWord`;
  const compareUrl  = `${API_BASE_URL}/api/GuessTheWord/GetComparision`;

  const MAX_ATTEMPTS = 5;

  let currentToken = null;
  let currentUsername = null;
  let currentWordLength = 0;
  let currentWord = "";

  // Round state — resets on every "Get new word"
  let attemptIndex = 0; // 0-based index of the CURRENT (active) row
  let wordPattern = [];
  let grayLetters = new Set();
  let roundLocked = false;
  let rowTileRefs = []; // rowTileRefs[i] = array of .guess-tile elements for row i

  const guessInput = document.getElementById("guessInput");

  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("signupBtn").addEventListener("click", doSignUp);
  document.getElementById("logoutBtn").addEventListener("click", doLogout);
  document.getElementById("newWordBtn").addEventListener("click", getNewWord);
  document.getElementById("submitGuessBtn").addEventListener("click", submitGuess);
  guessInput.addEventListener("input", updateActiveRowDisplay);
  guessInput.addEventListener("keypress", function (e) {
    if (e.key === "Enter") submitGuess();
  });

  function buildAttemptsBoard(length) {
    const board = document.getElementById("attemptsBoard");
    board.innerHTML = "";
    rowTileRefs = [];

    for (let r = 0; r < MAX_ATTEMPTS; r++) {
      const row = document.createElement("div");
      row.className = "attempt-row" + (r === 0 ? " row-active" : " row-pending");
      row.id = `attemptRow-${r}`;

      const label = document.createElement("div");
      label.className = "attempt-row-label";
      label.textContent = `Attempt ${r + 1}`;
      row.appendChild(label);

      const wrap = document.createElement("div");
      wrap.className = "tile-input-wrap";
      wrap.id = `tileWrap-${r}`;

      const tileRow = document.createElement("div");
      tileRow.className = "tile-row";

      const tiles = [];
      for (let i = 0; i < length; i++) {
        const tile = document.createElement("div");
        tile.className = "guess-tile";
        tileRow.appendChild(tile);
        tiles.push(tile);
      }
      rowTileRefs.push(tiles);

      wrap.appendChild(tileRow);
      row.appendChild(wrap);
      board.appendChild(row);
    }

    // Move the single real input into the first (active) row
    document.getElementById("tileWrap-0").appendChild(guessInput);
  }

  function updateActiveRowDisplay() {
    const value = guessInput.value.toUpperCase();
    const tiles = rowTileRefs[attemptIndex] || [];
    tiles.forEach((tile, i) => {
      const char = value[i] || "";
      tile.textContent = char;
      tile.classList.toggle("filled", char !== "");
      tile.classList.toggle("next", i === value.length);
    });
  }

  function paintRowResult(rowIndex, comparison) {
    const tiles = rowTileRefs[rowIndex];
    comparison.forEach((item, i) => {
      const tile = tiles[i];
      tile.className = `guess-tile result status-${item.status}`;
      tile.textContent = item.char;
    });
  }

  function activateRow(rowIndex) {
    // Mark previous row as completed (no longer active/pending styling)
    document.querySelectorAll(".attempt-row").forEach((el, i) => {
      el.classList.remove("row-active", "row-pending");
      if (i > rowIndex) el.classList.add("row-pending");
      if (i === rowIndex) el.classList.add("row-active");
    });

    document.getElementById(`tileWrap-${rowIndex}`).appendChild(guessInput);
    guessInput.value = "";
    guessInput.disabled = false;
    updateActiveRowDisplay();
    guessInput.focus();
  }

  function updatePatternDisplay() {
    const row = document.getElementById("patternRow");
    row.innerHTML = "";
    wordPattern.forEach(ch => {
      const tile = document.createElement("div");
      tile.className = "pattern-tile" + (ch === "_" ? " blank" : "");
      tile.textContent = ch === "_" ? "" : ch;
      row.appendChild(tile);
    });
  }

  function updateGrayLettersDisplay() {
    const el = document.getElementById("grayLettersDisplay");
    if (grayLetters.size === 0) {
      el.textContent = "Not in word: —";
    } else {
      el.innerHTML = `Not in word: <span class="letters">${Array.from(grayLetters).join(", ")}</span>`;
    }
  }

  function resetRoundState(length) {
    attemptIndex = 0;
    wordPattern = Array(length).fill("_");
    grayLetters = new Set();
    roundLocked = false;

    document.getElementById("congratsBanner").classList.add("hidden");
    document.getElementById("congratsBanner").classList.remove("win", "lose");
    document.getElementById("submitGuessBtn").disabled = false;

    buildAttemptsBoard(length);
    updatePatternDisplay();
    updateGrayLettersDisplay();

    guessInput.maxLength = length;
    guessInput.disabled = false;
    guessInput.value = "";
    updateActiveRowDisplay();
  }

  function lockRound() {
    roundLocked = true;
    document.getElementById("submitGuessBtn").disabled = true;
    guessInput.disabled = true;
  }

  function showBanner(message, variant) {
    const banner = document.getElementById("congratsBanner");
    banner.textContent = message;
    banner.classList.remove("hidden", "win", "lose");
    banner.classList.add(variant);
  }

  function startCountdownAndAdvance(seconds) {
    const resultEl = document.getElementById("result");
    let remaining = seconds;
    resultEl.textContent = `Your new word is ready in ${remaining} seconds`;

    const intervalId = setInterval(() => {
      remaining--;
      if (remaining > 0) {
        resultEl.textContent = `Your new word is ready in ${remaining} seconds`;
      } else {
        clearInterval(intervalId);
      }
    }, 1000);

    setTimeout(getNewWord, seconds * 1000);
  }

  function resetGameUI() {
    document.getElementById("wordInfo").classList.add("hidden");
    document.getElementById("attemptsBoard").innerHTML = "";
    document.getElementById("congratsBanner").classList.add("hidden");
    currentWord = "";
    currentWordLength = 0;
  }

  function doLogout() {
    currentToken = null;
    currentUsername = null;
    resetGameUI();
    document.getElementById("gameSection").classList.add("hidden");
    document.getElementById("loginSection").classList.remove("hidden");
    document.getElementById("password").value = "";
    document.getElementById("result").textContent = "Signed out.";
  }

  async function doLogin() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const resultEl = document.getElementById("result");

    try {
      resultEl.textContent = "Signing in...";
      currentToken = await getAuthToken(username, password);
      currentUsername = username;
      document.getElementById("signedInUser").textContent = currentUsername;
      resultEl.textContent = "Signed in.";
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("gameSection").classList.remove("hidden");
    } catch (err) {
      resultEl.textContent = `Sign-in error: ${err.message}`;
    }
  }

  async function doSignUp() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const resultEl = document.getElementById("result");

    if (!username || !password) {
      resultEl.textContent = "Enter a username and password to create an account.";
      return;
    }

    try {
      resultEl.textContent = "Creating account...";
      const response = await fetch(registerUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userName: username, password: password })
      });

      if (response.status === 409) {
        resultEl.textContent = "That username is taken. Try signing in instead.";
        return;
      }
      if (!response.ok) {
        resultEl.textContent = `Could not create account: ${await response.text()}`;
        return;
      }

      resultEl.textContent = "Account created. Signing you in...";
      await doLogin();
    } catch (err) {
      resultEl.textContent = `Sign-up error: ${err.message}`;
    }
  }

  async function getAuthToken(username, password) {
    const response = await fetch(authUrl, {
      method: "POST",
      headers: { "accept": "*/*", "Content-Type": "application/json" },
      body: JSON.stringify({ userName: username, password: password })
    });

    if (!response.ok) {
      throw new Error(`${response.status} - ${await response.text()}`);
    }

    const data = await response.json();
    const token = data.token || data.access_token;
    if (!token) throw new Error("No token in login response");

    return token;
  }

  async function getNewWord() {
    const resultEl = document.getElementById("result");
    if (!currentToken) {
      resultEl.textContent = "Sign in first.";
      return;
    }

    try {
      resultEl.textContent = "Fetching new word...";
      const response = await fetch(wordUrl, {
        method: "GET",
        headers: { "accept": "text/plain", "Authorization": `Bearer ${currentToken}` }
      });

      if (!response.ok) {
        throw new Error(`${response.status}: ${await response.text()}`);
      }

      currentWord = (await response.text()).trim();
      currentWordLength = currentWord.length;

      document.getElementById("maxLen").textContent = currentWordLength;
      document.getElementById("wordInfo").classList.remove("hidden");
      resetRoundState(currentWordLength);

      resultEl.textContent = "New word ready. Type your guess.";
    } catch (err) {
      resultEl.textContent = `Error: ${err.message}`;
    }
  }

  function submitGuess() {
    if (roundLocked) return;
    const guess = guessInput.value.trim().toUpperCase();
    if (guess.length !== currentWordLength) {
      alert("Guess must be exactly " + currentWordLength + " letters!");
      return;
    }
    getComparision(guess);
  }

  async function getComparision(guess) {
    const resultEl = document.getElementById("result");
    if (!currentToken) {
      resultEl.textContent = "Sign in first.";
      return;
    }

    try {
      resultEl.textContent = "Checking guess...";
      const url = `${compareUrl}?guess=${encodeURIComponent(guess)}`;
      const response = await fetch(url, {
        method: "GET",
        headers: { "accept": "text/plain", "Authorization": `Bearer ${currentToken}` }
      });

      if (!response.ok) {
        throw new Error(`${response.status}: ${await response.text()}`);
      }

      const comparison = JSON.parse(await response.text());

      comparison.forEach(item => {
        if (item.status === "GREEN") {
          wordPattern[item.index] = item.char.toUpperCase();
        } else if (item.status === "GRAY") {
          grayLetters.add(item.char.toUpperCase());
        }
      });

      paintRowResult(attemptIndex, comparison);
      updatePatternDisplay();
      updateGrayLettersDisplay();

      const isWin = comparison.length === currentWordLength && comparison.every(item => item.status === "GREEN");
      const wasLastAttempt = attemptIndex === MAX_ATTEMPTS - 1;

      if (isWin) {
        lockRound();
        showBanner(`🎉 You got it! The word was ${currentWord}.`, "win");
        startCountdownAndAdvance(5);
      } else if (wasLastAttempt) {
        lockRound();
        showBanner(`💀 Out of attempts. The word was ${currentWord}.`, "lose");
        startCountdownAndAdvance(5);
      } else {
        attemptIndex++;
        activateRow(attemptIndex);
        resultEl.textContent = `Comparison received (${comparison.length} letters).`;
      }
    } catch (err) {
      resultEl.textContent = `Comparison error: ${err.message}`;
    }
  }
</script>
</body>
</html>
