<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBoard — Guess the Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Roboto+Slab:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14181F;
            --panel: #1D2430;
            --panel-raised: #242C3A;
            --paper: #F1E9D8;
            --amber: #D9A441;
            --amber-dim: #B8863A;
            --moss: #4C7A57;
            --brick: #B25445;
            --slate: #3A3F47;
            --text-hi: #EDEAE3;
            --text-lo: #9AA3AF;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--ink);
            color: var(--text-hi);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 20px 60px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            animation: rise 0.5s ease both;
        }

        h1 {
            font-family: 'Roboto Slab', serif;
            font-weight: 700;
            font-size: 2.4rem;
            letter-spacing: 0.5px;
            color: var(--paper);
        }

            h1 span {
                color: var(--amber);
            }

        header p {
            color: var(--text-lo);
            font-size: 0.95rem;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            animation: rise 0.6s ease both;
        }

            .panel + .panel {
                margin-top: 20px;
            }

        .field {
            margin-bottom: 18px;
        }

            .field label {
                display: block;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                color: var(--text-lo);
                margin-bottom: 8px;
                font-weight: 600;
            }

            .field input[type="text"],
            .field input[type="password"] {
                width: 100%;
                background: var(--panel-raised);
                border: 1px solid rgba(255,255,255,0.08);
                border-radius: 8px;
                padding: 13px 14px;
                font-family: 'Inter', sans-serif;
                font-size: 1rem;
                color: var(--text-hi);
                transition: border-color 0.15s ease, box-shadow 0.15s ease;
            }

            .field input:focus-visible {
                outline: none;
                border-color: var(--amber);
                box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.2);
            }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        button {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

            button:focus-visible {
                outline: 2px solid var(--amber);
                outline-offset: 2px;
            }

        .btn-primary {
            background: var(--amber);
            color: #1A1300;
            flex: 1;
        }

            .btn-primary:hover {
                background: #E5B15A;
                transform: translateY(-1px);
            }

        .btn-secondary {
            background: transparent;
            color: var(--text-hi);
            border: 1px solid rgba(255,255,255,0.15);
        }

            .btn-secondary:hover {
                border-color: var(--amber);
                color: var(--amber);
            }

        .btn-block {
            width: 100%;
        }

        #gameSection {
            max-width: 520px;
        }

        .word-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-raised);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 18px 0;
            font-family: 'IBM Plex Mono', monospace;
        }

            .word-meta .label {
                color: var(--text-lo);
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.6px;
            }

            .word-meta .value {
                color: var(--amber);
                font-weight: 600;
                font-size: 1.1rem;
            }

        /* Signature element: guess entry rendered as live letter tiles */
        .tile-input-wrap {
            position: relative;
            margin-bottom: 18px;
        }

        .tile-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .guess-tile {
            width: 46px;
            height: 52px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            background: var(--panel-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            font-size: 1.4rem;
            color: var(--text-hi);
            transition: border-color 0.1s ease, background 0.1s ease;
        }

            .guess-tile.filled {
                border-color: var(--amber-dim);
                background: rgba(217,164,65,0.08);
            }

        .tile-row:focus-within .guess-tile {
            border-color: var(--amber);
        }

        #guessInput {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            font-size: 16px; /* prevents iOS zoom-on-focus */
            border: none;
            background: transparent;
        }

        #newWordBtn {
            width: 100%;
            margin-bottom: 4px;
        }

        .comparison-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .letter-tile {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            color: var(--paper);
            animation: flip 0.35s ease both;
        }

        .status-GRAY {
            background: var(--slate);
        }

        .status-YELLOW {
            background: var(--amber);
            color: #1A1300;
        }

        .status-GREEN {
            background: var(--moss);
        }

        .letter-tile:nth-child(1) {
            animation-delay: 0.02s;
        }

        .letter-tile:nth-child(2) {
            animation-delay: 0.07s;
        }

        .letter-tile:nth-child(3) {
            animation-delay: 0.12s;
        }

        .letter-tile:nth-child(4) {
            animation-delay: 0.17s;
        }

        .letter-tile:nth-child(5) {
            animation-delay: 0.22s;
        }

        .letter-tile:nth-child(6) {
            animation-delay: 0.27s;
        }

        .letter-tile:nth-child(7) {
            animation-delay: 0.32s;
        }

        #result {
            width: 100%;
            max-width: 520px;
            margin-top: 22px;
            padding: 16px 18px;
            background: var(--panel);
            border-left: 3px solid var(--amber-dim);
            border-radius: 0 8px 8px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-lo);
            white-space: pre-wrap;
            max-height: 220px;
            overflow-y: auto;
        }

        .hidden {
            display: none !important;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flip {
            from {
                opacity: 0;
                transform: rotateX(90deg);
            }

            to {
                opacity: 1;
                transform: rotateX(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.9rem;
            }

            .panel {
                padding: 24px 20px;
            }

            .guess-tile, .letter-tile {
                width: 38px;
                height: 44px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Play<span>Board</span></h1>
        <p>Guess the word, one tile at a time.</p>
    </header>

    <!-- Login / Sign up -->
    <div id="loginSection" class="panel">
        <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" />
        </div>
        <div class="btn-row">
            <button id="loginBtn" class="btn-primary">Sign in</button>
            <button id="signupBtn" class="btn-secondary">Create account</button>
        </div>
    </div>

    <!-- Game (hidden until login) -->
    <div id="gameSection" class="panel hidden">
        <button id="newWordBtn" class="btn-primary">Get new word</button>

        <div id="wordInfo" class="word-meta hidden">
            <span class="label">Word length</span>
            <span class="value"><span id="maxLen">0</span> letters</span>
        </div>

        <div class="tile-input-wrap">
            <div id="tileRow" class="tile-row"></div>
            <input id="guessInput" type="text" maxlength="0" autocomplete="off" />
        </div>

        <button id="submitGuessBtn" class="btn-primary btn-block">Submit guess</button>

        <div id="comparisonContainer"></div>
    </div>

    <pre id="result"></pre>

    <script>
        const API_BASE_URL = "https://playboard-gwdzehg5bee5fje4.indiasouthcentral-01.azurewebsites.net";
        const authUrl = `${API_BASE_URL}/api/Auth/Login`;
        const registerUrl = `${API_BASE_URL}/api/Auth/Register`;
        const wordUrl = `${API_BASE_URL}/api/GuessTheWord/GetNewWord`;
        const compareUrl = `${API_BASE_URL}/api/GuessTheWord/GetComparision`;

        const CACHE_KEY = "auth_token";
        const CACHE_KEY_TIMESTAMP = "auth_token_ts";
        const MAX_AGE_SECONDS = 3600;

        let currentToken = null;
        let currentWordLength = 0;
        let currentWord = "";

        document.getElementById("loginBtn").addEventListener("click", doLogin);
        document.getElementById("signupBtn").addEventListener("click", doSignUp);
        document.getElementById("newWordBtn").addEventListener("click", getNewWord);
        document.getElementById("submitGuessBtn").addEventListener("click", submitGuess);
        document.getElementById("guessInput").addEventListener("input", updateTileDisplay);
        document.getElementById("guessInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") submitGuess();
        });

        function renderEmptyTiles(length) {
            const row = document.getElementById("tileRow");
            row.innerHTML = "";
            for (let i = 0; i < length; i++) {
                const tile = document.createElement("div");
                tile.className = "guess-tile";
                row.appendChild(tile);
            }
        }

        function updateTileDisplay() {
            const value = document.getElementById("guessInput").value.toUpperCase();
            const tiles = document.querySelectorAll("#tileRow .guess-tile");
            tiles.forEach((tile, i) => {
                const char = value[i] || "";
                tile.textContent = char;
                tile.classList.toggle("filled", char !== "");
            });
        }

        async function doLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const resultEl = document.getElementById("result");

            try {
                resultEl.textContent = "Signing in...";
                currentToken = await getAuthToken(username, password);
                resultEl.textContent = "Signed in.";
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("gameSection").classList.remove("hidden");
            } catch (err) {
                resultEl.textContent = `Sign-in error: ${err.message}`;
            }
        }

        async function doSignUp() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const resultEl = document.getElementById("result");

            if (!username || !password) {
                resultEl.textContent = "Enter a username and password to create an account.";
                return;
            }

            try {
                resultEl.textContent = "Creating account...";
                const response = await fetch(registerUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userName: username, password: password })
                });

                if (response.status === 409) {
                    resultEl.textContent = "That username is taken. Try signing in instead.";
                    return;
                }
                if (!response.ok) {
                    resultEl.textContent = `Could not create account: ${await response.text()}`;
                    return;
                }

                resultEl.textContent = "Account created. Signing you in...";
                await doLogin();
            } catch (err) {
                resultEl.textContent = `Sign-up error: ${err.message}`;
            }
        }

        async function getAuthToken(username, password) {
            const cachedToken = sessionStorage.getItem(CACHE_KEY);
            const cachedTsStr = sessionStorage.getItem(CACHE_KEY_TIMESTAMP);
            if (cachedToken && cachedTsStr) {
                const cachedTs = parseInt(cachedTsStr);
                const now = Math.floor(Date.now() / 1000);
                if (now - cachedTs < MAX_AGE_SECONDS) {
                    return cachedToken;
                }
            }

            const response = await fetch(authUrl, {
                method: "POST",
                headers: { "accept": "*/*", "Content-Type": "application/json" },
                body: JSON.stringify({ userName: username, password: password })
            });

            if (!response.ok) {
                throw new Error(`${response.status} - ${await response.text()}`);
            }

            const data = await response.json();
            const token = data.token || data.access_token;
            if (!token) throw new Error("No token in login response");

            const now = Math.floor(Date.now() / 1000);
            sessionStorage.setItem(CACHE_KEY, token);
            sessionStorage.setItem(CACHE_KEY_TIMESTAMP, now.toString());
            return token;
        }

        async function getNewWord() {
            const resultEl = document.getElementById("result");
            const container = document.getElementById("comparisonContainer");
            if (!currentToken) {
                resultEl.textContent = "Sign in first.";
                return;
            }

            try {
                resultEl.textContent = "Fetching new word...";
                container.innerHTML = "";
                const response = await fetch(wordUrl, {
                    method: "GET",
                    headers: { "accept": "text/plain", "Authorization": `Bearer ${currentToken}` }
                });

                if (!response.ok) {
                    throw new Error(`${response.status}: ${await response.text()}`);
                }

                currentWord = (await response.text()).trim();
                currentWordLength = currentWord.length;

                document.getElementById("maxLen").textContent = currentWordLength;
                document.getElementById("wordInfo").classList.remove("hidden");
                document.getElementById("guessInput").maxLength = currentWordLength;
                document.getElementById("guessInput").value = "";
                renderEmptyTiles(currentWordLength);
                document.getElementById("guessInput").focus();

                resultEl.textContent = "New word ready. Type your guess.";
            } catch (err) {
                resultEl.textContent = `Error: ${err.message}`;
            }
        }

        function submitGuess() {
            const guess = document.getElementById("guessInput").value.trim().toUpperCase();
            if (guess.length !== currentWordLength) {
                alert("Guess must be exactly " + currentWordLength + " letters!");
                return;
            }
            getComparision(guess, currentWord);
            document.getElementById("guessInput").value = "";
            updateTileDisplay();
        }

        async function getComparision(guess, word) {
            const resultEl = document.getElementById("result");
            const container = document.getElementById("comparisonContainer");
            if (!currentToken) {
                resultEl.textContent = "Sign in first.";
                return;
            }

            try {
                resultEl.textContent = "Checking guess...";
                const url = `${compareUrl}?question=${encodeURIComponent(word)}&guess=${encodeURIComponent(guess)}`;
                const response = await fetch(url, {
                    method: "GET",
                    headers: { "accept": "text/plain", "Authorization": `Bearer ${currentToken}` }
                });

                if (!response.ok) {
                    throw new Error(`${response.status}: ${await response.text()}`);
                }

                const comparison = JSON.parse(await response.text());

                container.innerHTML = "";
                const grid = document.createElement("div");
                grid.className = "comparison-grid";
                comparison.forEach(item => {
                    const tile = document.createElement("div");
                    tile.className = `letter-tile status-${item.status}`;
                    tile.textContent = item.char;
                    grid.appendChild(tile);
                });
                container.appendChild(grid);

                resultEl.textContent = `Comparison received (${comparison.length} letters).`;
            } catch (err) {
                resultEl.textContent = `Comparison error: ${err.message}`;
                container.innerHTML = "";
            }
        }
    </script>
</body>
</html>
