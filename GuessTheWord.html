<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuessTheWord Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-width: 400px;
            max-width: 500px;
            transition: all 0.3s ease;
        }

            .section:hover {
                transform: translateY(-5px);
                box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            }

        label {
            display: block;
            margin-bottom: 20px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
            min-width: 120px;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            }

            button:active {
                transform: translateY(0);
            }

        #wordInfo {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        #guessInput {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        #maxLen {
            color: #667eea;
            font-weight: bold;
        }

        #result {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            border-left: 5px solid #667eea;
            white-space: pre-wrap;
            font-family: monospace;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }

        /* Wordle-style comparison grid */
        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
            gap: 8px;
            margin-top: 15px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .letter-tile {
            width: 45px;
            height: 45px;
            border: 2px solid #d3d6da;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
        }

        .status-GRAY {
            background-color: #3a3a3c;
            color: white;
            border-color: #3a3a3c;
            transform: scale(0.95);
        }

        .status-YELLOW {
            background-color: #f6c743;
            color: black;
            border-color: #f6c743;
            animation: shake 0.5s ease-in-out;
        }

        .status-GREEN {
            background-color: #59a96a;
            color: white;
            border-color: #59a96a;
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-10px);
            }

            60% {
                transform: translateY(-5px);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .section {
                min-width: 90vw;
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .letter-tile {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <h1>🎮 GuessTheWord Game</h1>

    <!-- Login Section -->
    <div id="loginSection" class="section">
        <label>
            Username:
            <input id="username" value="string" />
        </label>
        <label>
            Password:
            <input id="password" type="password" value="string" />
        </label>
        <div>
            <button id="loginBtn">Login 🔐</button>
            <button id="signupBtn">Sign Up ➕</button>
        </div>
    </div>

    <!-- Game Section (hidden until login) -->
    <div id="gameSection" class="section hidden">
        <button id="newWordBtn">Get New Word 🎲</button>
        <div id="wordInfo"></div>
        <label>
            Guess (max length: <span id="maxLen">0</span>):
            <input id="guessInput" type="text" maxlength="0" />
        </label>
        <button id="submitGuessBtn">Submit Guess ✅</button>
        <div id="comparisonContainer"></div>
    </div>

    <pre id="result"></pre>

    <script>
        // Updated getComparision to parse JSON and render Wordle-style tiles
        async function getComparision(guess, word) {
            const resultEl = document.getElementById("result");
            const container = document.getElementById("comparisonContainer");
            if (!currentToken) {
                resultEl.textContent = "Login first!";
                return;
            }

            try {
                resultEl.textContent = "Fetching comparison...";
                const url = `${compareUrl}?question=${encodeURIComponent(word)}&guess=${encodeURIComponent(guess)}`;
                const response = await fetch(url, {
                    method: "GET",
                    headers: {
                        "accept": "text/plain",
                        "Authorization": `Bearer ${currentToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`${response.status}: ${await response.text()}`);
                }

                const comparisonJson = await response.text();
                const comparison = JSON.parse(comparisonJson);

                // Render beautiful Wordle-style grid
                container.innerHTML = "";
                const grid = document.createElement('div');
                grid.className = 'comparison-grid';

                comparison.forEach(item => {
                    const tile = document.createElement('div');
                    tile.className = `letter-tile status-${item.status}`;
                    tile.textContent = item.char;
                    grid.appendChild(tile);
                });

                container.appendChild(grid);
                resultEl.textContent = `Comparison received (${comparison.length} letters)`;
                console.log("Comparison:", comparison);
            } catch (err) {
                resultEl.textContent = `Comparison error: ${err.message}`;
                container.innerHTML = '';
            }
        }

        // Rest of your existing JavaScript unchanged...
        const authUrl = "https://localhost:7095/api/Auth/Login";
        const wordUrl = "https://localhost:7095/api/GuessTheWord/GetNewWord";
        const compareUrl = "https://localhost:7095/api/GuessTheWord/GetComparision";
        const CACHE_KEY = "auth_token";
        const CACHE_KEY_TIMESTAMP = "auth_token_ts";
        const MAX_AGE_SECONDS = 3600;

        let currentToken = null;
        let currentWordLength = 0;
        let currentWord = "";

        document.getElementById("loginBtn").addEventListener("click", doLogin);
        document.getElementById("signupBtn").addEventListener("click", doSignUp);
        document.getElementById("newWordBtn").addEventListener("click", getNewWord);
        document.getElementById("submitGuessBtn").addEventListener("click", submitGuess);
        document.getElementById("guessInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") submitGuess();
        });

        async function doLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const resultEl = document.getElementById("result");

            try {
                resultEl.textContent = "Logging in...";
                currentToken = await getAuthToken(username, password);
                resultEl.textContent = "Login successful! Token cached.";
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("gameSection").classList.remove("hidden");
            } catch (err) {
                resultEl.textContent = `Login error: ${err.message}`;
            }
        }

        function doSignUp() {
            alert("Sign up endpoint not implemented. Use login for now.");
        }

        async function getNewWord() {
            const resultEl = document.getElementById("result");
            const container = document.getElementById("comparisonContainer");
            if (!currentToken) {
                resultEl.textContent = "Login first!";
                return;
            }

            try {
                resultEl.textContent = "Fetching new word...";
                container.innerHTML = ''; // Clear previous comparison
                const response = await fetch(wordUrl, {
                    method: "GET",
                    headers: {
                        "accept": "text/plain",
                        "Authorization": `Bearer ${currentToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`${response.status}: ${await response.text()}`);
                }

                currentWord = (await response.text()).trim();
                currentWordLength = currentWord.length;
                document.getElementById("maxLen").textContent = currentWordLength;
                document.getElementById("guessInput").maxLength = currentWordLength;
                document.getElementById("guessInput").value = "";
                document.getElementById("wordInfo").innerHTML = `Word length: ${currentWordLength} letters`;
                resultEl.textContent = "New word ready! Guess it.";
            } catch (err) {
                resultEl.textContent = `Error: ${err.message}`;
            }
        }

        function submitGuess() {
            const guess = document.getElementById("guessInput").value.trim().toUpperCase();
            if (guess.length !== currentWordLength) {
                alert("Guess must be exactly " + currentWordLength + " letters!");
                return;
            }
            compareString(guess, currentWord);
            document.getElementById("guessInput").value = "";
        }

        function compareString(guess, word) {
            getComparision(guess, word);
        }

        async function getAuthToken(username, password) {
            const cachedToken = sessionStorage.getItem(CACHE_KEY);
            const cachedTsStr = sessionStorage.getItem(CACHE_KEY_TIMESTAMP);
            if (cachedToken && cachedTsStr) {
                const cachedTs = parseInt(cachedTsStr);
                const now = Math.floor(Date.now() / 1000);
                if (now - cachedTs < MAX_AGE_SECONDS) {
                    console.log("Using cached token");
                    return cachedToken;
                }
            }

            const response = await fetch(authUrl, {
                method: "POST",
                headers: {
                    "accept": "*/*",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ userName: username, password: password })
            });

            if (!response.ok) {
                throw new Error(`Login failed: ${response.status} - ${await response.text()}`);
            }

            const data = await response.json();
            const token = data.token || data.access_token;
            if (!token) {
                throw new Error("No token in login response");
            }

            const now = Math.floor(Date.now() / 1000);
            sessionStorage.setItem(CACHE_KEY, token);
            sessionStorage.setItem(CACHE_KEY_TIMESTAMP, now.toString());
            return token;
        }
    </script>
</body>
</html>
